# CodePortal — sama infrastruktura + narzędzia, bez budowania aplikacji.
# Do lokalnego developmentu: aplikacje odpalasz przez `pnpm dev`.
#
#   pnpm db:up      (= docker compose -f docker-compose.infra.yml up -d)
#   pnpm db:down
#
# Pełny stack (docker-compose.yml) dołącza ten plik przez `include`, więc oba
# warianty używają tych samych kontenerów i wolumenów (te same dane).

name: codeportal

services:
  # ── Bazy i magazyny ───────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeportal}
      POSTGRES_DB: ${POSTGRES_DB:-codeportal}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Magazyn plików zgodny z S3 (duże testy, zdjęcia z kamerki).
  # SeaweedFS zamiast MinIO — MinIO nie publikuje już obrazów Dockera.
  # Porty: 8333 = API S3, 8888 = przeglądarka plików (filer UI).
  s3:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    ports: ["${S3_PORT:-8333}:8333", "${S3_UI_PORT:-8888}:8888"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Jednorazowo: tworzy bucket.
  s3-init:
    image: amazon/aws-cli:2.40.2
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-codeportal}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-codeportal-dev}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-codeportal}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || aws --endpoint-url http://s3:8333 s3 mb "s3://$$S3_BUCKET"
    restart: "no"

  # ── Narzędzia ─────────────────────────────────────────────────────────────
  # Podgląd i edycja PostgreSQL: http://localhost:8080
  # (System: PostgreSQL, serwer: postgres, login/hasło: codeportal/codeportal)
  adminer:
    image: adminer:6.3.0
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ["${ADMINER_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  # Podgląd Redisa i kolejek BullMQ: http://localhost:5540 (połączenie dodane automatycznie)
  redisinsight:
    image: redis/redisinsight:3.6.0
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: codeportal
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    ports: ["${REDISINSIGHT_PORT:-5540}:5540"]
    volumes: [redisinsight:/data]
    depends_on:
      redis: { condition: service_healthy }

configs:
  s3-identities:
    content: |
      {
        "identities": [
          {
            "name": "codeportal",
            "credentials": [
              { "accessKey": "${S3_ACCESS_KEY:-codeportal}", "secretKey": "${S3_SECRET_KEY:-codeportal-dev}" }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  pgdata:
  redisdata:
  s3data:
  redisinsight:
